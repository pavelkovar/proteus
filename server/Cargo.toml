[package]
name = "proteus"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Release code `perf` can attribute; `strip = true` on release leaves a
# profile of bare addresses. Call graphs need `perf record --call-graph dwarf`,
# there being no frame pointer.
[profile.profiling]
inherits = "release"
strip = false
debug = 1

[dependencies]
brotli = "9"
bytes = "1"
dashmap = "6"
flate2 = { version = "1", features = ["zlib-rs"] }
headers = "0.4"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
humantime = "2.4.0"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
ipnetwork = { version = "0.21.1", features = ["serde"] }
libc = "0.2"
libloading = "0.9"
mimalloc = "0.1.52"
mime_guess = "2"
nix = { version = "0.31.3", features = ["event", "fs", "process", "socket", "user", "uio", "signal"] }
postcard = { version = "1", features = ["alloc"] }
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11"
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "fs", "signal"] }
tokio-seqpacket = "0.9"
tokio-stream = "0.1"
zstd = "0.14"

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["gzip", "json", "multipart"] }
